name: Connected AquaGuide Blind Smoke

on:
  workflow_dispatch:
    inputs:
      confirm_paid_calls:
        description: 'Type RUN_CONNECTED_AQUAGUIDE_BLIND_SMOKE to authorize paid DeepSeek calls'
        required: true
        type: string
      model:
        description: 'DeepSeek model ID'
        required: true
        default: deepseek-v4-flash
        type: string
      max_steps:
        description: 'Maximum Blind Actor steps per AquaGuide journey'
        required: true
        default: '12'
        type: choice
        options:
          - '10'
          - '12'
          - '15'

permissions:
  contents: read

jobs:
  connected-aquaguide-blind-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment:
      name: connected-model-calibration
      deployment: false
    env:
      EVALPILOT_AI_PROVIDER: deepseek
      EVALPILOT_DEEPSEEK_API_KEY: ${{ secrets.EVALPILOT_CALIBRATION_DEEPSEEK_API_KEY }}
      EVALPILOT_DEEPSEEK_MODEL: ${{ inputs.model }}
      TARGET_APP_COMMIT: 8663b469c50605529367daf1b69ac0cd7cfb0cac
      OUTPUT_DIR: connected-aquaguide-blind-output
      MAX_STEPS: ${{ inputs.max_steps }}
      CONFIRM_PAID_CALLS: ${{ inputs.confirm_paid_calls }}

    steps:
      - name: Checkout EvalPilot
        uses: actions/checkout@v4

      - name: Checkout pinned AquaGuide
        uses: actions/checkout@v4
        with:
          repository: chusday97/aquaguide-tank-guide
          ref: 8663b469c50605529367daf1b69ac0cd7cfb0cac
          path: real-products/aquaguide

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Confirm remote-call authorization
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo 'Connected AquaGuide Blind Smoke is restricted to the main branch.' >&2
            echo "Current ref: $GITHUB_REF" >&2
            exit 2
          fi
          if [[ "$CONFIRM_PAID_CALLS" != "RUN_CONNECTED_AQUAGUIDE_BLIND_SMOKE" ]]; then
            echo 'Remote model calls were not explicitly authorized.' >&2
            echo 'Re-run the workflow and type RUN_CONNECTED_AQUAGUIDE_BLIND_SMOKE exactly.' >&2
            exit 2
          fi
          if [[ -z "$EVALPILOT_DEEPSEEK_API_KEY" ]]; then
            echo 'Environment secret EVALPILOT_CALIBRATION_DEEPSEEK_API_KEY is not configured.' >&2
            echo 'No remote model calls were made.' >&2
            exit 2
          fi

      - name: Install EvalPilot
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Install AquaGuide
        working-directory: real-products/aquaguide
        run: npm ci

      - name: Start AquaGuide web
        working-directory: real-products/aquaguide
        run: |
          npm run dev:web > ../../connected-aquaguide-vite.log 2>&1 &
          echo $! > ../../connected-aquaguide-vite.pid

      - name: Wait for AquaGuide
        run: |
          for attempt in $(seq 1 80); do
            if curl --fail --silent http://127.0.0.1:3000/ >/dev/null; then
              exit 0
            fi
            sleep 0.25
          done
          cat connected-aquaguide-vite.log || true
          exit 1

      - name: Record no-call preflight
        shell: bash
        run: |
          set -euo pipefail
          npm run --silent smoke:connected-aquaguide -- \
            --preflight \
            --url http://127.0.0.1:3000 \
            --output "$OUTPUT_DIR" \
            --max-steps "$MAX_STEPS" \
            --json | tee connected-aquaguide-preflight.json

      - name: Validate no-call preflight
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const preflight = JSON.parse(await readFile('connected-aquaguide-preflight.json', 'utf8'));
          if (preflight.status !== 'ready' || preflight.canRun !== true || preflight.remoteCallsMade !== false) {
            throw new Error('Connected AquaGuide preflight is not a ready, zero-call plan.');
          }
          if (preflight.provider?.provider !== 'deepseek' || preflight.provider?.model !== process.env.EVALPILOT_DEEPSEEK_MODEL) {
            throw new Error(`Unexpected provider/model: ${preflight.provider?.provider ?? 'none'} / ${preflight.provider?.model ?? 'none'}.`);
          }
          if (preflight.targetAppGitSha !== process.env.TARGET_APP_COMMIT) {
            throw new Error('Pinned AquaGuide commit changed during preflight.');
          }
          if (preflight.executionConfig?.allowScreenshotToProvider !== false) {
            throw new Error('Screenshots must remain disabled for the connected AquaGuide smoke.');
          }
          NODE

      - name: Run connected AquaGuide Blind Smoke
        shell: bash
        run: |
          set -euo pipefail
          npm run --silent smoke:connected-aquaguide -- \
            --url http://127.0.0.1:3000 \
            --output "$OUTPUT_DIR" \
            --max-steps "$MAX_STEPS" \
            --json | tee connected-aquaguide-result.json

      - name: Validate connected smoke protocol
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const result = JSON.parse(await readFile('connected-aquaguide-result.json', 'utf8'));
          if (result.analysisMode !== 'connected_aquaguide_blind_smoke') {
            throw new Error('Connected AquaGuide result is missing the expected smoke contract.');
          }
          if (result.provider?.providerId !== 'deepseek' || result.provider?.model !== process.env.EVALPILOT_DEEPSEEK_MODEL) {
            throw new Error(`Unexpected provider/model: ${result.provider?.providerId ?? 'none'} / ${result.provider?.model ?? 'none'}.`);
          }
          if (result.targetAppGitSha !== process.env.TARGET_APP_COMMIT) {
            throw new Error('Connected smoke did not evaluate the pinned AquaGuide commit.');
          }
          if (result.executionConfig?.allowScreenshotToProvider !== false) {
            throw new Error('Connected smoke unexpectedly enabled screenshots to the provider.');
          }
          if (result.protocolHealthy !== true) {
            throw new Error(`Connected smoke protocol is unhealthy: providerFailures=${result.providerFailureCount}, evaluatorFailures=${result.evaluatorFailureCount}, actorOracleLeaks=${result.actorOracleLeakCount}, judgeOracleVisible=${result.judgeOracleVisible}.`);
          }
          NODE

      - name: Upload connected AquaGuide evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: connected-aquaguide-blind-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            connected-aquaguide-preflight.json
            connected-aquaguide-result.json
            connected-aquaguide-blind-output/
            connected-aquaguide-vite.log
          if-no-files-found: warn
          retention-days: 30
