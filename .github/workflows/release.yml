name: Public Alpha release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Prerelease tag, for example v0.5.0-alpha.1
        required: true
      publish_npm:
        description: Publish with npm Trusted Publishing after it is configured
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Install Chromium for release smoke tests
        run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run test:runner
      - run: npm run test:dashboard
      - name: Verify release tag matches package version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: node -e "const expected='v'+require('./package.json').version;if(process.env.RELEASE_TAG!==expected)throw new Error('Expected '+expected+', got '+process.env.RELEASE_TAG)"
      - run: mkdir release-artifacts
      - name: Pack the only release tarball
        id: pack
        run: |
          npm pack --ignore-scripts --pack-destination release-artifacts
          echo "tarball=release-artifacts/evalpilot-local-$(node -p \"require('./package.json').version\").tgz" >> "$GITHUB_OUTPUT"
      - run: node scripts/audit-package.mjs "${{ steps.pack.outputs.tarball }}"
      - run: node scripts/verify-consumer.mjs "${{ steps.pack.outputs.tarball }}"
      - run: node scripts/verify-public-example.mjs "${{ steps.pack.outputs.tarball }}"
      - run: shasum -a 256 release-artifacts/*.tgz > release-artifacts/SHA256SUMS.txt
      - name: Publish npm alpha with provenance
        if: ${{ inputs.publish_npm }}
        run: npm publish "${{ steps.pack.outputs.tarball }}" --tag alpha --provenance
      - name: Create GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ inputs.tag }}" release-artifacts/* --prerelease --generate-notes --target "${{ github.sha }}"
