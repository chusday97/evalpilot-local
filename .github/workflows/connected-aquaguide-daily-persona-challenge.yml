name: Connected AquaGuide Daily Persona Challenge

on:
  workflow_dispatch:
    inputs:
      confirm_paid_calls:
        description: 'Type RUN_CONNECTED_AQUAGUIDE_DAILY_PERSONA_CHALLENGE to authorize the persona Challenge DeepSeek calls'
        required: true
        type: string
      target_app_commit:
        description: 'Exact AquaGuide commit SHA to evaluate'
        required: true
        default: 3d73c033b6899e3a92144f6de99a05db8babde78
        type: string
      model:
        description: 'DeepSeek model ID'
        required: true
        default: deepseek-v4-flash
        type: string

permissions:
  contents: read

jobs:
  connected-aquaguide-daily-persona-challenge:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: connected-model-calibration
      deployment: false
    env:
      EVALPILOT_AI_PROVIDER: deepseek
      EVALPILOT_DEEPSEEK_MODEL: ${{ inputs.model }}
      TARGET_APP_COMMIT: ${{ inputs.target_app_commit }}
      OUTPUT_DIR: connected-aquaguide-daily-persona-challenge-output
      MAX_STEPS: '12'
      CONFIRM_PAID_CALLS: ${{ inputs.confirm_paid_calls }}

    steps:
      - name: Confirm remote-call authorization
        shell: bash
        env:
          EVALPILOT_DEEPSEEK_API_KEY: ${{ secrets.EVALPILOT_CALIBRATION_DEEPSEEK_API_KEY }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo 'Connected AquaGuide persona Challenge is restricted to main.' >&2
            exit 2
          fi
          if [[ "$CONFIRM_PAID_CALLS" != "RUN_CONNECTED_AQUAGUIDE_DAILY_PERSONA_CHALLENGE" ]]; then
            echo 'Remote model calls were not explicitly authorized.' >&2
            echo 'Re-run and type RUN_CONNECTED_AQUAGUIDE_DAILY_PERSONA_CHALLENGE exactly.' >&2
            exit 2
          fi
          if [[ -z "$EVALPILOT_DEEPSEEK_API_KEY" ]]; then
            echo 'Environment secret EVALPILOT_CALIBRATION_DEEPSEEK_API_KEY is not configured.' >&2
            echo 'No remote model calls were made.' >&2
            exit 2
          fi
          if [[ ! "$TARGET_APP_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'target_app_commit must be an exact 40-character lowercase Git SHA.' >&2
            echo 'No remote model calls were made.' >&2
            exit 2
          fi

      - name: Checkout EvalPilot
        uses: actions/checkout@v4

      - name: Checkout pinned AquaGuide
        uses: actions/checkout@v4
        with:
          repository: chusday97/aquaguide-tank-guide
          ref: ${{ inputs.target_app_commit }}
          path: real-products/aquaguide

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install EvalPilot
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Install AquaGuide
        working-directory: real-products/aquaguide
        run: npm ci

      - name: Start AquaGuide web
        working-directory: real-products/aquaguide
        run: |
          npm run dev:web > ../../connected-aquaguide-persona-vite.log 2>&1 &
          echo $! > ../../connected-aquaguide-persona-vite.pid

      - name: Wait for AquaGuide
        run: |
          for attempt in $(seq 1 80); do
            if curl --fail --silent http://127.0.0.1:3000/ >/dev/null; then
              exit 0
            fi
            sleep 0.25
          done
          cat connected-aquaguide-persona-vite.log || true
          exit 1

      - name: Record zero-call persona Challenge preflight
        shell: bash
        env:
          EVALPILOT_DEEPSEEK_API_KEY: ${{ secrets.EVALPILOT_CALIBRATION_DEEPSEEK_API_KEY }}
        run: |
          set -euo pipefail
          npx tsx scripts/run-connected-aquaguide-daily-retest.ts \
            --challenge persona \
            --preflight \
            --url http://127.0.0.1:3000 \
            --output "$OUTPUT_DIR" \
            --max-steps "$MAX_STEPS" \
            --json | tee connected-aquaguide-persona-preflight.json

      - name: Validate zero-call persona Challenge preflight
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const preflight = JSON.parse(await readFile('connected-aquaguide-persona-preflight.json', 'utf8'));
          if (preflight.analysisMode !== 'connected_aquaguide_daily_persona_challenge_preflight') throw new Error('Persona Challenge preflight contract is missing.');
          if (preflight.status !== 'ready' || preflight.canRun !== true || preflight.remoteCallsMade !== false) throw new Error('Persona Challenge preflight is not a ready, zero-call plan.');
          if (JSON.stringify(preflight.caseIds) !== JSON.stringify(['case-challenge-blind-daily-check-risk-persona'])) throw new Error(`Unexpected persona Challenge case set: ${JSON.stringify(preflight.caseIds)}.`);
          if (preflight.executionConfig?.challengeMode !== 'persona' || preflight.executionConfig?.journeyMode !== 'daily_persona_challenge') throw new Error(`Unexpected persona Challenge execution config: ${JSON.stringify(preflight.executionConfig ?? null)}.`);
          if (preflight.executionConfig?.maxAgentSteps !== 12 || preflight.executionConfig?.prerequisiteRemoteCalls !== 0) throw new Error('Persona Challenge must keep max_steps=12 and zero prerequisite remote calls.');
          if (preflight.executionConfig?.allowScreenshotToProvider !== false) throw new Error('Screenshots must remain disabled for the persona Challenge.');
          if (preflight.setupValidation?.ready !== true || preflight.setupValidation?.dailyTaskVisible !== true || preflight.setupValidation?.diagnosisRecordCount !== 0 || preflight.setupValidation?.remoteCallsMade !== false) throw new Error(`Persona Challenge browser setup validation failed: ${JSON.stringify(preflight.setupValidation ?? null)}.`);
          if (preflight.provider?.provider !== 'deepseek' || preflight.provider?.model !== process.env.EVALPILOT_DEEPSEEK_MODEL) throw new Error(`Unexpected provider/model: ${preflight.provider?.provider ?? 'none'} / ${preflight.provider?.model ?? 'none'}.`);
          if (preflight.targetAppGitSha !== process.env.TARGET_APP_COMMIT) throw new Error('Pinned AquaGuide commit changed during persona Challenge preflight.');
          NODE

      - name: Run connected AquaGuide persona Challenge
        shell: bash
        env:
          EVALPILOT_DEEPSEEK_API_KEY: ${{ secrets.EVALPILOT_CALIBRATION_DEEPSEEK_API_KEY }}
        run: |
          set -euo pipefail
          npx tsx scripts/run-connected-aquaguide-daily-retest.ts \
            --challenge persona \
            --url http://127.0.0.1:3000 \
            --output "$OUTPUT_DIR" \
            --max-steps "$MAX_STEPS" \
            --json | tee connected-aquaguide-persona-result.json

      - name: Validate trustworthy persona Challenge verdict
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const result = JSON.parse(await readFile('connected-aquaguide-persona-result.json', 'utf8'));
          if (result.analysisMode !== 'connected_aquaguide_daily_persona_challenge') throw new Error('Connected persona Challenge result is missing the expected contract.');
          if (result.targetAppGitSha !== process.env.TARGET_APP_COMMIT) throw new Error('Persona Challenge did not evaluate the pinned AquaGuide commit.');
          if (JSON.stringify(result.caseIds) !== JSON.stringify(['case-challenge-blind-daily-check-risk-persona'])) throw new Error(`Unexpected persona Challenge result case set: ${JSON.stringify(result.caseIds)}.`);
          if (result.protocolHealthy !== true) throw new Error(`Persona Challenge protocol unhealthy: providerFailures=${result.providerFailureCount}, evaluatorFailures=${result.evaluatorFailureCount}, unknownFailures=${result.unknownFailureCount}, actorOracleLeaks=${result.actorOracleLeakCount}, judgeOracleVisible=${result.judgeOracleVisible}.`);
          const trustworthyPass = result.taskResult?.verdict === 'pass' && result.taskResult?.failureSource === null && result.taskResult?.runtimeFailureSource === null;
          const trustworthyProductFail = result.taskResult?.verdict === 'fail' && result.taskResult?.failureSource === 'product' && result.taskResult?.runtimeFailureSource === null;
          if (!trustworthyPass && !trustworthyProductFail) throw new Error(`Persona Challenge did not produce a trustworthy product verdict: verdict=${result.taskResult?.verdict ?? 'none'}, failureSource=${result.taskResult?.failureSource ?? 'none'}, runtimeSource=${result.taskResult?.runtimeFailureSource ?? 'none'}.`);
          if (trustworthyPass) {
            if (result.productJourneyPassed !== true || result.taskResult?.semanticVerdict !== 'pass' || result.taskResult?.semanticTaskCompletion !== 'complete') throw new Error('Persona Challenge PASS did not satisfy complete semantic/product PASS conditions.');
            const checks = new Map((result.taskResult?.deterministicChecks || []).map(check => [check.assertionId, check.verdict]));
            for (const assertionId of ['blind-daily-risk','blind-daily-action','blind-daily-recorded-high-risk','blind-daily-breathing-only-summary','blind-daily-no-false-water-abnormal-summary','blind-daily-no-false-water-change-action']) {
              if (checks.get(assertionId) !== 'pass') throw new Error(`Persona Challenge PASS missed deterministic assertion ${assertionId}: ${checks.get(assertionId) ?? 'missing'}.`);
            }
          }
          console.log(JSON.stringify({ protocolHealthy: result.protocolHealthy, productVerdict: result.taskResult?.verdict, failureSource: result.taskResult?.failureSource, challengeCoverageVerified: trustworthyPass }));
          NODE

      - name: Upload connected AquaGuide persona Challenge evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: connected-aquaguide-daily-persona-challenge-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            connected-aquaguide-persona-preflight.json
            connected-aquaguide-persona-result.json
            connected-aquaguide-daily-persona-challenge-output/
            connected-aquaguide-persona-vite.log
          if-no-files-found: warn
          retention-days: 30
