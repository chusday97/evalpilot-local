name: One-shot Patch AquaGuide Persona Challenge Runner

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/one-shot-add-aquaguide-persona-challenge.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Patch Daily runner for explicit persona Challenge mode
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'scripts/run-connected-aquaguide-daily-retest.ts';
          let source = fs.readFileSync(path, 'utf8');

          function replaceExact(oldText, newText, label) {
            const parts = source.split(oldText);
            if (parts.length !== 2) throw new Error(`${label}: expected exactly one anchor, found ${parts.length - 1}`);
            source = parts[0] + newText + parts[1];
          }

          replaceExact("  AQUAGUIDE_DAILY_RETEST_CASE_ID,\n", "", 'remove unused base case id import');
          replaceExact("} from '../src/validation/aquaguide-daily-retest-contract.js';\n", "} from '../src/validation/aquaguide-daily-retest-contract.js';\nimport { selectAquaGuidePuiBc023NextChallenge } from '../src/validation/aquaguide-pui-bc-023-challenges.js';\n", 'add persona challenge import');
          replaceExact("  constructor(\n    private readonly delegate: AiProvider,\n    private readonly audits: ProviderAudit[],\n  ) {", "  constructor(\n    private readonly delegate: AiProvider,\n    private readonly audits: ProviderAudit[],\n    private readonly fallbackCaseId: string,\n    private readonly oracleMarker: string,\n  ) {", 'audit provider constructor');
          replaceExact("      caseId: String(request.metadata.caseId ?? AQUAGUIDE_DAILY_RETEST_CASE_ID),\n      markerPresent: combinedPrompt.includes(AQUAGUIDE_DAILY_RETEST_ORACLE_MARKER),", "      caseId: String(request.metadata.caseId ?? this.fallbackCaseId),\n      markerPresent: combinedPrompt.includes(this.oracleMarker),", 'audit provider dynamic case');
          replaceExact("const jsonOutput = process.argv.includes('--json');\nconst evalCase = buildAquaGuideDailyRetestCase();", "const jsonOutput = process.argv.includes('--json');\nconst challengeMode = arg('--challenge', 'none');\nif (challengeMode !== 'none' && challengeMode !== 'persona') {\n  throw new Error(`Unsupported --challenge mode: ${challengeMode}. Expected none or persona.`);\n}\nconst isPersonaChallenge = challengeMode === 'persona';\nconst evalCase = isPersonaChallenge ? selectAquaGuidePuiBc023NextChallenge() : buildAquaGuideDailyRetestCase();\nconst analysisMode = isPersonaChallenge\n  ? 'connected_aquaguide_daily_persona_challenge'\n  : AQUAGUIDE_DAILY_RETEST_ANALYSIS_MODE;", 'select challenge case');
          replaceExact("    journeyMode: 'daily_only',\n    setupMode: AQUAGUIDE_DAILY_RETEST_SETUP_MODE,", "    challengeMode,\n    journeyMode: isPersonaChallenge ? 'daily_persona_challenge' : 'daily_only',\n    setupMode: AQUAGUIDE_DAILY_RETEST_SETUP_MODE,", 'execution config challenge mode');
          replaceExact("    analysisMode: `${AQUAGUIDE_DAILY_RETEST_ANALYSIS_MODE}_preflight`,", "    analysisMode: `${analysisMode}_preflight`,", 'preflight analysis mode');
          replaceExact("    claimBoundary: [\n      'Preflight validates the pinned product setup in a real browser and makes zero remote provider calls.',\n      'Only blind-daily-check-risk is eligible for remote execution; Create Aquarium and Record Livestock are replaced by deterministic local setup.',\n      'The local setup shape is derived from AquaGuide GP-003 returning-user Daily Check fixture and creates no diagnosis record before the Actor starts.',\n      'This is a same EvalCase retest for PUI-BC-023 plus end-to-end confirmation of the PUI-BC-024 output fix; it is not a model reliability estimate or human usability study.',\n      'Screenshots are not sent to the provider.',\n    ],", "    claimBoundary: [\n      'Preflight validates the pinned product setup in a real browser and makes zero remote provider calls.',\n      isPersonaChallenge\n        ? 'Only case-challenge-blind-daily-check-risk-persona is eligible for remote execution; deterministic local setup replaces prerequisite journeys.'\n        : 'Only blind-daily-check-risk is eligible for remote execution; Create Aquarium and Record Livestock are replaced by deterministic local setup.',\n      'The local setup shape is derived from AquaGuide GP-003 returning-user Daily Check fixture and creates no diagnosis record before the Actor starts.',\n      isPersonaChallenge\n        ? 'This is an unexecuted low-patience persona Challenge derived from the trusted PUI-BC-023 PASS; preflight readiness is not Challenge coverage.'\n        : 'This is a same EvalCase retest for PUI-BC-023 plus end-to-end confirmation of the PUI-BC-024 output fix; it is not a model reliability estimate or human usability study.',\n      'Screenshots are not sent to the provider.',\n    ],", 'preflight claim boundary');
          replaceExact("    throw new Error(`Connected AquaGuide Daily retest requires DeepSeek; received ${baseProvider.info.providerId}.`);", "    throw new Error(`Connected AquaGuide Daily evaluation requires DeepSeek; received ${baseProvider.info.providerId}.`);", 'provider requirement message');
          replaceExact("  const provider = new AuditedProvider(baseProvider, providerAudits);", "  const provider = new AuditedProvider(baseProvider, providerAudits, evalCase.caseId, AQUAGUIDE_DAILY_RETEST_ORACLE_MARKER);", 'audited provider construction');
          replaceExact("    analysisMode: AQUAGUIDE_DAILY_RETEST_ANALYSIS_MODE,", "    analysisMode,", 'diagnostic analysis mode');
          replaceExact("    claimBoundary: [\n      'This retest executes only blind-daily-check-risk against one pinned AquaGuide commit.',\n      'Create Aquarium and Record Livestock use deterministic local setup and make zero remote model calls.',\n      'A PASS requires a healthy Blind Experience protocol, deterministic Oracle PASS, semantic Judge PASS, completed Agent run, and failureSource=null.',\n      'PUI-BC-023 is eligible for lifecycle closure only after this same EvalCase produces that complete connected PASS.',\n      'PUI-BC-024 is already deterministic product-regression verified; this connected retest adds end-to-end evidence but is not required to establish the code fix.',\n      'Provider timeout, evaluator interruption, missing Judge Oracle visibility, or unknown attribution makes this run non-PASS and must not be promoted to Product Failure by absence of success evidence alone.',\n      'No screenshot was sent to the provider.',\n    ],", "    claimBoundary: [\n      isPersonaChallenge\n        ? 'This Challenge executes only case-challenge-blind-daily-check-risk-persona against one pinned AquaGuide commit.'\n        : 'This retest executes only blind-daily-check-risk against one pinned AquaGuide commit.',\n      'Create Aquarium and Record Livestock use deterministic local setup and make zero remote model calls.',\n      isPersonaChallenge\n        ? 'A healthy Challenge run may produce either a trustworthy PASS or a trustworthy Product FAIL; Product FAIL is an evaluation result, not an evaluator failure.'\n        : 'A PASS requires a healthy Blind Experience protocol, deterministic Oracle PASS, semantic Judge PASS, completed Agent run, and failureSource=null.',\n      isPersonaChallenge\n        ? 'Challenge coverage becomes verified only on trustworthy PASS; a trustworthy Product FAIL remains evidence for product triage and does not inherit PASS coverage.'\n        : 'PUI-BC-023 is eligible for lifecycle closure only after this same EvalCase produces that complete connected PASS.',\n      'PUI-BC-024 is already deterministic product-regression verified; its output assertions remain end-to-end guards.',\n      'Provider timeout, evaluator interruption, missing Judge Oracle visibility, or unknown attribution makes the result non-trustworthy and must not be promoted to Product Failure by absence of success evidence alone.',\n      'No screenshot was sent to the provider.',\n    ],", 'diagnostic claim boundary');
          replaceExact("  const diagnosticPath = resolve(outputDir, 'connected-aquaguide-daily-retest.json');", "  const diagnosticPath = resolve(outputDir, isPersonaChallenge ? 'connected-aquaguide-daily-persona-challenge.json' : 'connected-aquaguide-daily-retest.json');", 'diagnostic path');

          fs.writeFileSync(path, source);
          NODE

      - name: Verify patch statically
        shell: bash
        run: |
          set -euo pipefail
          grep -F "const challengeMode = arg('--challenge', 'none');" scripts/run-connected-aquaguide-daily-retest.ts
          grep -F "connected_aquaguide_daily_persona_challenge" scripts/run-connected-aquaguide-daily-retest.ts
          grep -F "selectAquaGuidePuiBc023NextChallenge()" scripts/run-connected-aquaguide-daily-retest.ts
          grep -F "journeyMode: isPersonaChallenge ? 'daily_persona_challenge' : 'daily_only'" scripts/run-connected-aquaguide-daily-retest.ts
          npm run check

      - name: Commit runner patch and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/one-shot-add-aquaguide-persona-challenge.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/run-connected-aquaguide-daily-retest.ts .github/workflows/one-shot-add-aquaguide-persona-challenge.yml
          git diff --cached --check
          git commit -m 'feat: enable AquaGuide persona Challenge mode'
          git push origin HEAD:main
