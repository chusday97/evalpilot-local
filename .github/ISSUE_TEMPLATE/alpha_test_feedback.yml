name: Public Alpha test feedback
description: Report a first-use blocker without sharing private project data
body:
  - type: markdown
    attributes:
      value: |
        Thank you for testing EvalPilot Local.
        Do not attach source code, `.env` files, tokens, Agent conversations, unredacted screenshots, Trace archives, or the full data directory.
  - type: input
    id: versions
    attributes:
      label: EvalPilot, Node, and macOS versions
      placeholder: evalpilot 0.5.0-alpha.1; Node 24.x; macOS 15.x
    validations:
      required: true
  - type: dropdown
    id: result
    attributes:
      label: First-use result
      options:
        - Completed without help
        - Completed with help
        - Blocked by EvalPilot
        - Blocked by the target project
        - Stopped for privacy or safety
    validations:
      required: true
  - type: dropdown
    id: duration
    attributes:
      label: Time to first report
      options:
        - Under 5 minutes
        - 5–10 minutes
        - 10–15 minutes
        - More than 15 minutes
        - No report opened
    validations:
      required: true
  - type: dropdown
    id: blocked_step
    attributes:
      label: Where did you get stuck?
      options:
        - Installation or doctor
        - Opening Dashboard
        - Adding the project
        - Starting the project
        - Choosing the evaluation
        - Running the evaluation
        - Understanding the report
        - Exporting a repair task
        - I was not blocked
    validations:
      required: true
  - type: textarea
    id: visible_result
    attributes:
      label: What did you see, and what did you expect?
      description: Use generic or redacted names. Include the recovery action you tried.
    validations:
      required: true
  - type: dropdown
    id: report_understanding
    attributes:
      label: Could you identify release readiness, the top problem, and the next action?
      options:
        - Yes, all three
        - Partly
        - No
        - I did not reach the report
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed private paths, business data, secrets, and personal information.
          required: true
